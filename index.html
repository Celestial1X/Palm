<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — ระบบจัดการลานปาล์ม</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="login-logo">
        <span class="emoji">🌴</span>
        <h1>ระบบจัดการลานปาล์ม</h1>
        <p>Palm Station Management System</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <div class="form-group">
        <label class="form-label">ชื่อผู้ใช้</label>
        <input type="text" id="userId" class="form-control" placeholder="กรอกชื่อผู้ใช้" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary btn-block btn-lg" id="loginBtn" onclick="doLogin()">
        🔑 เข้าสู่ระบบ
      </button>

      <div class="login-divider">เข้าสู่ระบบด่วน (Demo)</div>
      <div class="quick-login">
        <button class="quick-btn" onclick="quickLogin('admin','admin1234')">
          <strong>👑 Admin</strong>
          ผู้ดูแลระบบ
        </button>
        <button class="quick-btn" onclick="quickLogin('station1','station1')">
          <strong>🌿 ลานปาล์ม A</strong>
          station1
        </button>
        <button class="quick-btn" onclick="quickLogin('station2','station2')">
          <strong>🌱 ลานปาล์ม B</strong>
          station2
        </button>
        <button class="quick-btn" onclick="quickLogin('station3','station3')">
          <strong>🍃 ลานปาล์ม C</strong>
          station3
        </button>
      </div>

      <p class="version-tag">v2.0.0 © 2567 ระบบจัดการลานปาล์ม</p>
    </div>
  </div>

  <script>
  /* ====== DATA ====== */
  const USERS = [
    { id:'admin',    name:'ผู้ดูแลระบบ', role:'admin',   password:'admin1234', station:null },
    { id:'station1', name:'ลานปาล์ม A',  role:'station', password:'station1',  station:'ST001' },
    { id:'station2', name:'ลานปาล์ม B',  role:'station', password:'station2',  station:'ST002' },
    { id:'station3', name:'ลานปาล์ม C',  role:'station', password:'station3',  station:'ST003' },
  ];

  const Auth = {
    login(userId, password) {
      const user = USERS.find(u => u.id === userId && u.password === password);
      if (user) { localStorage.setItem('palmUser', JSON.stringify(user)); return user; }
      return null;
    }
  };

  function showAlert(el, type, msg) {
    el.className = 'alert alert-' + type + ' show';
    el.innerHTML = msg;
    setTimeout(() => { el.className = 'alert'; }, 4000);
  }

  function doLogin() {
    const alertBox = document.getElementById('alertBox');
    const userId   = document.getElementById('userId').value.trim();
    const password = document.getElementById('password').value;
    if (!userId || !password) { showAlert(alertBox,'warning','⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
    const user = Auth.login(userId, password);
    if (!user) { showAlert(alertBox,'danger','❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); return; }
    showAlert(alertBox,'success','✅ เข้าสู่ระบบสำเร็จ กำลังนำทาง...');
    setTimeout(() => {
      window.location.href = user.role === 'admin' ? 'pages/admin.html' : 'pages/station.html';
    }, 700);
  }

  function quickLogin(id, pw) {
    document.getElementById('userId').value = id;
    document.getElementById('password').value = pw;
    doLogin();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  /* Auto-redirect if already logged in */
  (function() {
    const d = localStorage.getItem('palmUser');
    if (d) {
      const u = JSON.parse(d);
      window.location.href = u.role === 'admin' ? 'pages/admin.html' : 'pages/station.html';
    }
  })();
  </script>
</body>
</html>
